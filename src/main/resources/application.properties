spring.application.name=ImpulseLock

spring.datasource.url=jdbc:mysql://localhost:3306/impulselock
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is owned by Flyway migrations (src/main/resources/db/migration). Hibernate only
# validates the mapped entities against that schema at startup - it must never create or
# alter tables itself (see docs/v2/database-design.md).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true