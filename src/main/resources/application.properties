spring.application.name=ImpulseLock

# Render (and most container PaaS) tell the container which port to bind on via $PORT rather
# than honouring the Dockerfile's EXPOSE. Spring Boot binds SERVER_PORT natively but NOT PORT,
# so map it explicitly. Defaults to 8080, leaving local dev, docker-compose's 8080:8080 mapping
# and its localhost:8080 healthcheck completely unchanged.
server.port=${PORT:8080}


# DB connection details are env-var-driven with local-dev defaults - the same pattern already used
# for app.jwt.secret. This is the actual fix for docs/v1/design-decisions.md's "plaintext DB
# credentials committed" item; docker-compose overrides these to point at the `mysql` service
# instead of localhost (see docs/v2/deployment-plan.md).
#
# Managed MySQL (Aiven, and any DB reachable over the public internet) requires TLS. The driver
# default is sslMode=PREFERRED, which encrypts when the server offers it but SILENTLY falls back
# to plaintext if the handshake fails - not good enough for a production DB over the internet.
# Append `?sslMode=REQUIRED` to the SPRING_DATASOURCE_URL value in the hosting dashboard so a
# failed handshake fails the connection loudly instead:
#     jdbc:mysql://<host>:<port>/<db>?sslMode=REQUIRED
# The hostname lives entirely in the env var - nothing provider-specific is committed here.
# NOTE: mysql-connector-j 9.x still accepts the legacy `useSSL`/`requireSSL` pair, but its own
# docs mark them DEPRECATED and ignore them whenever sslMode is set explicitly. Use sslMode.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/impulselock}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is owned by Flyway migrations (src/main/resources/db/migration). Hibernate only
# validates the mapped entities against that schema at startup - it must never create or
# alter tables itself (see docs/v2/database-design.md).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# JWT signing secret MUST be overridden via the JWT_SECRET env var outside local dev - this
# default is committed and therefore public (see docs/v2/security-design.md#secrets-management).
app.jwt.secret=${JWT_SECRET:phase1-dev-only-secret-please-override-via-env-var-do-not-use-in-prod}
app.jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
app.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:7}

# Comma-separated list, read by CorsConfig - replaces V1's hardcoded localhost:3000
# (see docs/v1/backend.md#corsconfig).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Brute-force guard on POST /auth/login (see LoginRateLimiter) - closes the "rate limiting" item
# security-design.md left open pending deployment shape, settled in Phase 6 (single instance, no
# shared cache needed).
app.security.login-rate-limit.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
app.security.login-rate-limit.window-minutes=${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}

# Swagger UI / OpenAPI spec (see OpenApiConfig) - enabled by default (dev/docker); disabled
# entirely in prod below. Forward-compatible infrastructure: the real dev/docker/prod profile
# split is still Phase 6 (see docs/v2/tasks.md, Phase 0's note) - this multi-document block
# activates correctly once a "prod" profile is actually selected, same pattern as Phase 1's
# early /api/v2/admin/** rule and Phase 4's docker/prod logback blocks.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Only /actuator/health is exposed (permitAll in SecurityConfig) - it backs the docker-compose
# healthcheck (see docs/v2/deployment-plan.md). No other actuator endpoint is opened up; env/beans/
# etc would leak internals and aren't needed for this project's scope.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

#---
spring.config.activate.on-profile=prod
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
