server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend service (compose DNS name) - mirrors CRA's dev-only
    # "proxy": "http://localhost:8080" field, which has no effect on a production build.
    location /api/v2/ {
        proxy_pass http://backend:8080/api/v2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing - let React Router (if/when added) handle unknown paths.
    location / {
        try_files $uri /index.html;
    }
}
