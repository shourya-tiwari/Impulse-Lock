name: CI

# The only workflow in this repo, and a pure quality gate: it builds, tests and reports, and
# deliberately deploys nothing.
#
# Deployment is Render's and Vercel's own Git integration, both wired to auto-deploy on push to
# `main` (see DEPLOYMENT.md). There used to be a second `cd.yml` alongside this one that pushed
# images to GHCR and carried an `if: false` `deploy` stub; it was removed because nothing consumed
# those images (Render builds the repo-root Dockerfile itself, Vercel builds the CRA bundle itself)
# and the permanently-skipped stub advertised a gate that did not exist.
#
# Worth being honest about what this therefore is and is not: it is the gate on *merging* - a red
# run blocks the PR - but it is not a gate on *deploying*, because the platforms react to the push
# rather than to this workflow's result. Gating deploys would mean turning off platform
# auto-deploy and calling their deploy hooks from a job that `needs` these two.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # Runs the full test suite, including the Testcontainers-based repository/controller
      # tests (see docs/v2/testing-strategy.md) - the runner provides Docker, unlike this
      # project's local dev sandbox.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --watchAll=false

      - name: Build
        run: npm run build
